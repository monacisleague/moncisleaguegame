<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monaci's League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="shell">
        <!-- 1. MENU PRINCIPALE -->
        <div id="main-menu">
            <h1>MONACI'S LEAGUE</h1>
            <p class="subtitle">ARCADE SOCCER</p>
            <button class="arcade-btn" id="btn-play">GIOCA</button>
            <button class="arcade-btn" id="btn-settings">IMPOSTAZIONI</button>
        </div>

        <!-- 2. SELEZIONE SQUADRA -->
        <div id="team-select-screen" class="hidden">
            <h2>SCEGLI SQUADRA</h2>
            <div class="carousel-box" id="team-box-border">
                <button class="carousel-btn" id="btn-prev-team">&lt;</button>
                <div class="team-info">
                    <img id="current-team-logo" class="team-logo" src="" alt="Logo">
                    <span id="current-team-name" class="team-name-text">FC POLAR</span>
                </div>
                <button class="carousel-btn" id="btn-next-team">&gt;</button>
            </div>
            <div class="counter-text" id="team-counter">1 / 6</div>

            <h2>DIFFICOLTÀ</h2>
            <div class="carousel-box">
                <button class="carousel-btn" id="btn-prev-diff">&lt;</button>
                <span id="current-diff-name" class="diff-name-text">MEDIO</span>
                <button class="carousel-btn" id="btn-next-diff">&gt;</button>
            </div>
            <div class="counter-text" id="diff-counter">2 / 3</div>

            <button class="arcade-btn" id="btn-start-match">INIZIA PARTITA</button>
            <button class="arcade-btn btn-danger" id="btn-back-to-menu">INDIETRO</button>
        </div>

        <!-- 3. GAMEPLAY -->
        <div id="gameplay-screen" class="hidden">
            <div id="match-info" class="match-info-text">MONACI'S LEAGUE</div>
            
            <canvas id="game-canvas" width="340" height="400"></canvas>

            <button class="arcade-btn btn-small" id="btn-back-to-select">ABBANDONA</button>
        </div>

        <!-- MODALE IMPOSTAZIONI -->
        <div id="settings-modal" class="hidden">
            <h2>IMPOSTAZIONI</h2>
            <div class="setting-row">
                <label>MUSICA: <span id="music-val">80%</span></label><br>
                <input type="range" id="music-volume" min="0" max="100" value="80" class="range-input">
            </div>
            <div class="setting-row">
                <label>EFFETTI: <span id="sfx-val">100%</span></label><br>
                <input type="range" id="sfx-volume" min="0" max="100" value="100" class="range-input">
            </div>
            <button class="arcade-btn" id="btn-close-settings">CHIUDI</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
