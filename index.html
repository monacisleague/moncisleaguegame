<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaci's League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCHERMATA 1: MENU PRINCIPALE -->
    <div id="main-menu" class="screen">
        <h1>Monaci's League</h1>
        <p>Il roguelike calcistico definitivo.</p>
        <div id="menu-buttons">
            <button id="btn-start">Gioca</button>
            <button id="btn-settings">Impostazioni</button>
        </div>
    </div>

    <!-- SCHERMATA 2: IMPOSTAZIONI -->
    <div id="settings-screen" class="screen hidden">
        <h2>Impostazioni</h2>
        <div class="settings-group">
            <h3>Volume</h3>
            <label for="volume-audio">Musica & SFX:</label>
            <input type="range" id="volume-audio" min="0" max="100" value="80">
        </div>
        <div class="settings-group">
            <h3>Controlli & Mappatura</h3>
            <label for="control-device">Dispositivo:</label>
            <select id="control-device">
                <option value="pc">Computer (WASD / Frecce + Spazio)</option>
                <option value="mobile">Telefono (Touch)</option>
            </select>
        </div>
        <button id="btn-settings-back">Torna al Menu</button>
    </div>

    <!-- SCHERMATA 3: SELEZIONE SQUADRA E DIFFICOLTÀ -->
    <div id="team-select-screen" class="screen hidden">
        <h2>Seleziona la Squadra</h2>
        <div class="settings-group">
            <label for="team-choice">La tua Squadra:</label>
            <select id="team-choice">
                <option value="Monaci FC">Monaci FC</option>
                <option value="Lightning Eleven">Lightning Eleven</option>
                <option value="Fire Strikers">Fire Strikers</option>
                <option value="Shadow Dragons">Shadow Dragons</option>
                <option value="Royal Academy">Royal Academy</option>
                <option value="Neo Japan">Neo Japan</option>
            </select>
        </div>
        <h2>Seleziona Difficoltà</h2>
        <div class="settings-group">
            <select id="difficulty-choice">
                <option value="facile">Facile</option>
                <option value="media" selected>Media</option>
                <option value="difficile">Difficile</option>
            </select>
        </div>
        <div id="controls">
            <button id="btn-launch-match">Inizia Partita</button>
            <button id="btn-team-back">Indietro</button>
        </div>
    </div>

    <!-- SCHERMATA 4: CAMPO DA GIOCO (INTERATTIVO) -->
    <div id="match-screen" class="screen hidden" style="max-width: 800px;">
        <div id="match-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.7rem;">
            <div><span id="home-name">Squadra</span>: <span id="home-score">0</span></div>
            <div id="match-clock" style="color: #00ffcc;">Min: 0'</div>
            <div><span id="away-name">Avversario</span>: <span id="away-score">0</span></div>
        </div>

        <!-- Canvas del gioco in tempo reale -->
        <canvas id="gameCanvas" width="700" height="400" style="background: #111; border: 3px solid #FFD700; width: 100%; max-width: 700px; display: block; margin: 0 auto; image-rendering: pixelated;"></canvas>

        <div id="match-info" style="font-size: 0.6rem; margin-top: 10px; color: #FFD700; min-height: 25px;">
            Usa i tasti direzionali o WASD per muoverti, SPAZIO per calciare!
        </div>

        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
            <button id="btn-use-card" style="padding: 10px; font-size: 0.6rem;">Usa Carta Speciale</button>
            <button id="btn-quit-match" style="padding: 10px; font-size: 0.6rem; background-color: #ff4444; color: #fff;">Abbandona</button>
        </div>
    </div>

    <!-- SCHERMATA 5: CLASSIFICA DELLA LEGA -->
    <div id="standings-screen" class="screen hidden">
        <h2>Classifica Ufficiale</h2>
        <div id="standings-container">
            <table id="standings-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Squadra</th>
                        <th>Pt</th>
                    </tr>
                </thead>
                <tbody id="standings-body">
                    <!-- Generato via JS -->
                </tbody>
            </table>
        </div>
        <div id="controls">
            <button id="btn-next-round">Torna al Menu / Prossimo Turno</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
