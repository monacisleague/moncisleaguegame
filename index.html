<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaci's League</title>
    <!-- Font Pixel Art da Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCHERMATA PRINCIPALE (MENU) -->
    <div id="main-menu" class="screen">
        <header class="league-header">
            <img src="logo.png" alt="Logo Monaci's League" class="game-logo">
            <h1 class="gold-text">MONACI'S LEAGUE</h1>
        </header>

        <div class="menu-buttons">
            <button id="btn-play" class="btn-gold">GIOCA</button>
            <button id="btn-settings" class="btn-gold">IMPOSTAZIONI</button>
        </div>
    </div>

    <!-- SCHERMATA SELEZIONE SQUADRA E DIFFICOLTÀ CON CAROSELLI -->
    <div id="team-select-screen" class="screen hidden">
        <h1 class="gold-text">PREPARAZIONE PARTITA</h1>

        <!-- Sezione Selezione Squadra tramite Carosello -->
        <div class="selection-section">
            <h2 class="gold-subheading">SCEGLI LA TUA SQUADRA</h2>
            
            <div class="carousel-container">
                <button id="btn-prev-team" class="btn-arrow">◀</button>
                <div class="team-display-box" id="team-box-border">
                    <img id="current-team-logo" src="" alt="Logo Squadra" class="team-carousel-logo">
                    <span id="current-team-name" class="team-carousel-name">SQUADRA</span>
                </div>
                <button id="btn-next-team" class="btn-arrow">▶</button>
            </div>
            <p id="team-counter" class="team-counter-text">1 / 6</p>
        </div>

        <!-- Sezione Selezione Difficoltà tramite Carosello -->
        <div class="selection-section">
            <h2 class="gold-subheading">DIFFICOLTÀ</h2>
            
            <div class="carousel-container">
                <button id="btn-prev-diff" class="btn-arrow">◀</button>
                <div class="team-display-box diff-display-box">
                    <span id="current-diff-name" class="team-carousel-name diff-name-text">MEDIO</span>
                </div>
                <button id="btn-next-diff" class="btn-arrow">▶</button>
            </div>
            <p id="diff-counter" class="team-counter-text">2 / 3</p>
        </div>

        <!-- Pulsanti di Azione -->
        <div class="action-buttons">
            <button id="btn-start-match" class="btn-gold">AVVIA PARTITA</button>
            <button id="btn-back-to-menu" class="btn-gold">INDIETRO</button>
        </div>
    </div>

    <!-- MODALE IMPOSTAZIONI -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="gold-text">IMPOSTAZIONI</h2>

            <section class="settings-group">
                <h3 class="gold-text">AUDIO</h3>
                <div class="setting-item">
                    <label for="music-volume">Musica:</label>
                    <input type="range" id="music-volume" min="0" max="100" value="80">
                    <span id="music-val">80%</span>
                </div>
                <div class="setting-item">
                    <label for="sfx-volume">Effetti SFX:</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="100">
                    <span id="sfx-val">100%</span>
                </div>
            </section>

            <section class="settings-group">
                <h3 class="gold-text">CONTROLLI TASTIERA</h3>
                <div class="controls-grid">
                    <div><span>Spostamento:</span> <strong>Frecce / WASD</strong></div>
                    <div><span>Azione / Tiro:</span> <strong>Spazio</strong></div>
                    <div><span>Passaggio:</span> <strong>X</strong></div>
                </div>
            </section>

            <section class="settings-group">
                <h3 class="gold-text">CONTROLLI TOUCH (MOBILE)</h3>
                <div class="setting-item">
                    <label for="touch-toggle">Attiva Joypad Touch:</label>
                    <input type="checkbox" id="touch-toggle" checked>
                </div>
                <div class="setting-item">
                    <label for="touch-size">Dimensione Tasti:</label>
                    <select id="touch-size">
                        <option value="small">Piccola</option>
                        <option value="medium" selected>Media</option>
                        <option value="large">Grande</option>
                    </select>
                </div>
            </section>

            <button id="btn-close-settings" class="btn-gold">SALVA E CHIUDI</button>
        </div>
    </div>

    <!-- Segnaposto per la FASE 3 (Gameplay) -->
    <div id="gameplay-screen" class="screen hidden">
        <h1 class="gold-text">GAMEPLAY</h1>
        <p id="selected-summary-text" class="gold-subheading"></p>
        <p style="margin-top: 15px;">Pronto per la FASE 3!</p>
        <button id="btn-back-to-select" class="btn-gold" style="margin-top: 20px;">CAMBIA IMPOSTAZIONI</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
