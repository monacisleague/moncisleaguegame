<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monaci's League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCHERMATA 1: MENU PRINCIPALE -->
    <div id="main-menu" class="screen">
        <h1>Monaci's League</h1>
        <p>Il roguelike calcistico definitivo.</p>
        <div id="menu-buttons">
            <button id="btn-start">Gioca</button>
            <button id="btn-settings">Impostazioni</button>
        </div>
    </div>

    <!-- SCHERMATA 2: IMPOSTAZIONI -->
    <div id="settings-screen" class="screen hidden">
        <h2>Impostazioni</h2>
        <div class="settings-group">
            <h3>Volume</h3>
            <label for="volume-audio">Musica & SFX:</label>
            <input type="range" id="volume-audio" min="0" max="100" value="80">
        </div>
        <div class="settings-group">
            <h3>Dispositivo</h3>
            <label for="control-device">Modalità Controlli:</label>
            <select id="control-device">
                <option value="auto" selected>Auto-Rilevamento (Mobile/PC)</option>
                <option value="pc">Tastiera PC</option>
                <option value="mobile">Touch Mobile</option>
            </select>
        </div>
        <button id="btn-settings-back">Torna al Menu</button>
    </div>

    <!-- SCHERMATA 3: SELEZIONE SQUADRA E DIFFICOLTÀ -->
    <div id="team-select-screen" class="screen hidden">
        <h2>Seleziona Squadra</h2>
        <div class="settings-group">
            <select id="team-choice">
                <option value="Monaci FC">Monaci FC</option>
                <option value="Lightning Eleven">Lightning Eleven</option>
                <option value="Fire Strikers">Fire Strikers</option>
                <option value="Shadow Dragons">Shadow Dragons</option>
                <option value="Royal Academy">Royal Academy</option>
                <option value="Neo Japan">Neo Japan</option>
            </select>
        </div>
        <h2>Difficoltà</h2>
        <div class="settings-group">
            <select id="difficulty-choice">
                <option value="facile">Facile</option>
                <option value="media" selected>Media</option>
                <option value="difficile">Difficile</option>
            </select>
        </div>
        <div id="controls">
            <button id="btn-launch-match">Inizia Partita</button>
            <button id="btn-team-back">Indietro</button>
        </div>
    </div>

    <!-- SCHERMATA 4: CAMPO DA GIOCO VERTICALE STYLE INAZUMA -->
    <div id="match-screen" class="screen hidden match-container">
        <!-- HUD superiore -->
        <div id="hud-top">
            <div class="scoreboard-bar">
                <span class="team-tag" id="home-tag">Tu</span>
                <span class="score-num" id="home-score">0</span>
                <span class="score-divider">-</span>
                <span class="score-num" id="away-score">0</span>
                <span class="team-tag" id="away-tag">Rivali</span>
                <div class="match-time-badge" id="match-clock">0:00</div>
            </div>

            <!-- Indicatore Modalità Presidenziale su PC (Si attiva con TAB) -->
            <div id="pc-mode-indicator" class="pc-badge hidden">
                SPECIALE [TAB]: <span id="pc-mode-text">Carta Pres.</span>
            </div>

            <button id="btn-pause" class="pause-btn">II</button>
        </div>

        <!-- Canvas di gioco (Campo Verticale) -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- Controlli Touch Overlay (Mostrati SOLO su Mobile) -->
        <div id="touch-overlay">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <!-- TASTO CON LE FRECCE PER LO SWITCH SU MOBILE -->
            <button id="btn-switch-player" class="circle-btn switch-btn">⇄</button>

            <div id="action-buttons-group">
                <!-- SET ATTACCO -->
                <div id="attack-set" class="button-set-radial">
                    <button id="btn-dribble" class="circle-btn btn-blue pos-dribble">
                        <span>Dribbling</span>
                    </button>
                    <button id="btn-special" class="circle-btn btn-teal pos-special">
                        <span class="btn-main-txt">Carta Pres.</span>
                        <span class="btn-sub-txt">Special</span>
                    </button>
                    <button id="btn-pass" class="circle-btn btn-blue-dark pos-pass">
                        <span class="btn-main-txt">Passaggio</span>
                        <span class="btn-sub-txt">tieni premuto</span>
                    </button>
                    <button id="btn-shoot" class="circle-btn btn-gold-large pos-shoot">
                        <span class="btn-main-txt">Tiro</span>
                        <span class="btn-sub-txt">mantenere</span>
                    </button>
                </div>

                <!-- SET DIFESA -->
                <div id="defense-set" class="button-set-radial hidden">
                    <button id="btn-press" class="circle-btn btn-blue pos-dribble">
                        <span>Pressing</span>
                    </button>
                    <button id="btn-def-card" class="circle-btn btn-teal pos-special">
                        <span class="btn-main-txt">Carta Pres.</span>
                        <span class="btn-sub-txt">Special</span>
                    </button>
                    <button id="btn-slide" class="circle-btn btn-blue-dark pos-pass">
                        <span class="btn-main-txt">Scivolata</span>
                    </button>
                    <button id="btn-tackle" class="circle-btn btn-gold-large pos-shoot">
                        <span class="btn-main-txt">Tackle</span>
                        <span class="btn-sub-txt">intercetta</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCHERMATA 5: CLASSIFICA DELLA LEGA -->
    <div id="standings-screen" class="screen hidden">
        <h2>Classifica Ufficiale</h2>
        <div id="standings-container">
            <table id="standings-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Squadra</th>
                        <th>Pt</th>
                    </tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
        <div id="controls">
            <button id="btn-next-round">Menu Principale</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
